# Configuration for generating libstl_thumb.h. Regenerate the header after changing the C API with:
#   cargo install cbindgen
#   cbindgen --config cbindgen.toml --output libstl_thumb.h
language = "C"
cpp_compat = true
include_guard = "LIBSTL_THUMB_H"
autogen_warning = "/* Generated by cbindgen from src/lib.rs. Do not edit by hand, see cbindgen.toml. */"
